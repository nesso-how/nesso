name: Plugin release

on:
  push:
    tags: ['plugin-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Tag matches SDK and example versions
        run: |
          tag="${GITHUB_REF_NAME#plugin-v}"
          pkg="$(node -p "require('./packages/plugin/package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $tag does not match package version $pkg"; exit 1; }
          example="$(node -p "require('./packages/plugin/example/package.json').version")"
          [ "$tag" = "$example" ] || { echo "tag $tag does not match example version $example"; exit 1; }
          dependency="$(node -p "require('./packages/plugin/example/package.json').devDependencies['@nesso-how/plugin']")"
          [ "$tag" = "$dependency" ] || { echo "tag $tag does not match example SDK dependency $dependency"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Pack SDK for example build
        run: pnpm pack --out "$RUNNER_TEMP/plugin-sdk.tgz"
        working-directory: packages/plugin
      - name: Prepare standalone example
        run: cp -R packages/plugin/example "$RUNNER_TEMP/plugin-example"
      - name: Install example build dependencies
        run: npm install --no-save --package-lock=false "$RUNNER_TEMP/plugin-sdk.tgz"
        working-directory: ${{ runner.temp }}/plugin-example
      - name: Publish SDK
        run: pnpm publish
        working-directory: packages/plugin
      - name: Publish example
        run: npm publish
        working-directory: ${{ runner.temp }}/plugin-example
