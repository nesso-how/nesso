name: OpenCode review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npm install --global @opencode/cli@2.1.1
      - name: Review pull request
        id: review
        env:
          OPENCODE_CONSOLE_TOKEN: ${{ secrets.OPENCODE_API_KEY }}
          REVIEW_MODEL: ${{ vars.OPENCODE_REVIEW_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-review.ts
      - uses: marocchino/sticky-pull-request-comment@v2
        if: steps.review.outputs.ready == 'true'
        with:
          header: opencode-review
          path: ${{ runner.temp }}/review.md
