name: Review
run-name: 'Review PR #${{ inputs.pr }}'

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: opencode-review-${{ inputs.pr }}
      cancel-in-progress: true
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "::error::PR must be a positive integer"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pull-request.json"
          jq -e '.state == "open" and .head.repo.full_name == env.GITHUB_REPOSITORY' "$RUNNER_TEMP/pull-request.json" > /dev/null || {
            echo "::error::Review requires an open PR from this repository"
            exit 1
          }
          jq -r '"number=\(.number)\nbase=\(.base.sha)\nhead=\(.head.sha)"' "$RUNNER_TEMP/pull-request.json" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:packages
      - run: npm install --global @opencode/cli@2.1.1
      - name: Review pull request
        id: review
        env:
          OPENCODE_CONSOLE_TOKEN: ${{ secrets.OPENCODE_API_KEY }}
          REVIEW_MODEL: ${{ vars.OPENCODE_REVIEW_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          BASE_SHA: ${{ steps.pr.outputs.base }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: node scripts/ci-review.ts
      - uses: marocchino/sticky-pull-request-comment@v2
        if: steps.review.outputs.ready == 'true'
        with:
          number: ${{ steps.pr.outputs.number }}
          header: opencode-review
          path: ${{ runner.temp }}/review.md
