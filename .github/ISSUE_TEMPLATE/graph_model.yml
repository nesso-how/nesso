name: Graph model / edge type
description: Propose changes to semantic edge categories, relation types, or visual encoding
type: Feature
labels: [graph-model]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing, please skim the [Relation types reference](https://nesso.how/docs/reference/relation-types/) and the [`RelationTypeDef` schema](https://github.com/nesso-how/nesso/blob/main/packages/vocab-learning/src/relationTypes.ts). Every type declares its category, label, and canonical inverse.

  - type: textarea
    id: motivation
    attributes:
      label: Problem or motivation
      description: What concept or learning relationship is currently missing or misrepresented? Include a few concrete cases where the existing 52 types fall short.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed type definition
      description: |
        Describe the new or modified relation type(s). For each, include:

        **Visual / identity**
        - Suggested `RelationTypeName` (kebab-case) and `label`
        - `cat: RelationCategory` — taxonomic | structural | causal | dependency | temporal | opposition | similarity | epistemic (or propose a new category)
        - `line` (solid | dashed | dotted | double | wavy) and `glyph` if relevant

        **Identity**
        - `inverse: RelationTypeName` — canonical inverse in the set (self for symmetric). If you propose an asymmetric type, also propose its inverse.
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Concrete examples
      description: Two or three real concept pairs that would use this edge type. Cover at least one case showing direction semantics ("A → B means…") and, for asymmetric types, one case in each direction (forward and inverse).
    validations:
      required: true

  - type: textarea
    id: algorithmic-impact
    attributes:
      label: Algorithmic impact (optional)
      description: How would this type interact with traversal, centrality, similarity, or graph-comparison algorithms? Are there compositions with existing types worth noting (e.g. `subtype-of` ∘ `part-of` → `part-of`)?
    validations:
      required: false
